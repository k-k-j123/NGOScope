<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NGOScope — Credibility Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://api.fontshare.com/v2/css?f[]=geist@400,500,700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=instrument-serif@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="py-12">
  <header class="wrap mb-24 flex justify-between items-center">
    <div class="flex items-center gap-2">
        <span class="font-bold text-lg">NGOScope</span>
    </div>
    <div id="health-badge" class="badge">System: Online</div>
  </header>

  <main class="wrap">
    <section class="max-w-4xl animate-scroll-reveal">
      <h1 class="text-6xl md:text-8xl mb-8">Credibility <br> intelligence.</h1>
      <p class="text-xl text-[var(--muted)] mb-12">Assessing Indian NGOs through live web signals.</p>
    </section>

    <section class="card mb-24 animate-scroll-reveal">
      <form id="lookup-form" class="space-y-6">
        <div class="grid md:grid-cols-2 gap-6">
            <div>
                <label class="block text-xs uppercase tracking-wider text-[var(--muted)] mb-2">NGO Name</label>
                <input id="ngo-name" type="text" class="w-full border border-[var(--line)] p-3 rounded" placeholder="e.g. Pratham" required />
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-[var(--muted)] mb-2">State (optional)</label>
                <input id="ngo-state" type="text" class="w-full border border-[var(--line)] p-3 rounded" placeholder="e.g. Delhi" />
            </div>
        </div>
        <button id="analyze-btn" class="btn-primary w-full md:w-auto">Analyze NGO</button>
      </form>
      <p id="status" class="status" hidden></p>
    </section>

    <section id="results" class="animate-scroll-reveal" hidden>
        <!-- Result Bento Grid -->
        <div class="grid md:grid-cols-3 gap-6" id="result-grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
