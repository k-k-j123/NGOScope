[project]
name = "charitylens"
version = "0.2.0"
description = "AI NGO trust/transparency platform for Indian non-profits (SerpAPI-only, live)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
charitylens = "charitylens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "mcp_server.scrapers", "charitylens"]

[tool.pytest.ini_options]
testpaths = ["eval"]
asyncio_mode = "auto"